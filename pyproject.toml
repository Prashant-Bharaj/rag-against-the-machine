[project]
name = "student"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "bm25s[full]>=0.2.0",
    "transformers>=4.45.0",
    "torch>=2.0.0",
    "fire>=0.6.0",
    "pydantic>=2.0.0",
    "tqdm>=4.65.0",
    "PyStemmer>=2.0.1",
    "accelerate>=0.26.0",
]

[dependency-groups]
dev = ["flake8", "mypy", "pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
exclude = ["^\\.venv/", "^data/", "^context/"]

[[tool.mypy.overrides]]
module = ["bm25s", "bm25s.*", "Stemmer", "fire", "tqdm", "tqdm.*"]
ignore_missing_imports = true
